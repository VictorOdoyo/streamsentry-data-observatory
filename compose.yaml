services:
  api:
    build:
      context: .
    environment:
      STREAMSENTRY_CORS_ORIGINS: '["http://localhost:4173"]'
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4173:80"
